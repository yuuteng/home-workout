<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每天20分钟</title>
<meta name="description" content="居家哑铃增肌计划:上肢下肢交替,语音跟练,打卡记录">
<meta name="theme-color" content="#FBF6EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每天20分钟">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap">
<style>
  :root{
    --bg:#FBF6EF; --card:#FFFFFF; --ink:#2B2118; --mute:#9A8B7C; --line:#F1E8DC; --line-2:#E6D9C8; --track:#EADFD1;
    --acc:#FF5A36; --acc-2:#FF8A3D; --acc-ink:#E2461F; --acc-soft:#FFD9CF; --acc-wash:#FFEDE7; --acc-deep:#C2391B; --miss:#F3B3A3;
    --shadow:0 1px 0 #EFE4D6; --num:Outfit,"PingFang SC",sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
  button:focus-visible,a:focus-visible{outline:3px solid var(--acc-2);outline-offset:2px}
  img{display:block}
  .app{max-width:1240px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
  .panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
  .panel>h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}

  /* header */
  .hi{grid-area:hi;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hi small{display:block;color:var(--mute);font-size:13px}
  .hi h1{margin:0;font-size:24px;letter-spacing:-.01em;line-height:1.25}
  .streak{background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
  .streak i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}

  /* layout */
  .grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hi" "week" "hero" "ex" "cal" "set"}
  .week{grid-area:week}.hero{grid-area:hero}.exs{grid-area:ex}.cal{grid-area:cal}.set{grid-area:set}
  @media (min-width:960px){
    .app{padding:30px 34px 48px}
    .hi h1{font-size:30px}.hi small{font-size:14px}
    .grid{gap:18px 26px;grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;
      grid-template-areas:"hi hi" "hero ex" "week ex" "cal ex" "set ex"}
    .exs{align-self:start}
  }

  /* week strip */
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day{text-align:center;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
  .day span{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-weight:600;font-size:14px;color:var(--ink);background:var(--card);box-shadow:var(--shadow);transition:background .15s}
  .week.panel .day span{background:var(--bg);box-shadow:none}
  .day em{font-style:normal;font-size:11px;color:var(--mute)}
  .day.done span{background:var(--acc-soft)!important;color:var(--acc-deep)}
  .day.today span{background:var(--acc)!important;color:#fff}
  .day.rest span{background:none!important;color:#C9BBAA}
  .day.sel span{box-shadow:0 0 0 2px var(--ink)!important}
  .day.sel{color:var(--ink);font-weight:600}

  /* hero */
  .hero{background:linear-gradient(140deg,var(--acc),var(--acc-2));border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-28px;top:-28px;width:130px;height:130px;border-radius:50%;border:16px solid rgba(255,255,255,.18);pointer-events:none}
  .hero small{opacity:.88;font-size:13px}
  .hero h2{margin:2px 0 8px;font-size:26px;line-height:1.25}
  .hero .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.92}
  .hero .go{margin-top:16px;width:100%;background:#fff;color:var(--acc-ink);border-radius:99px;padding:13px;font-weight:700;font-size:16px;position:relative;z-index:1}
  .hero .go:disabled{opacity:.6;cursor:default}
  .hero .key{display:none;font-weight:500;font-size:13px;opacity:.7;margin-left:6px}
  @media (min-width:960px) and (hover:hover){.hero .key{display:inline}}
  .hero.rest{background:linear-gradient(140deg,#B7A895,#CDBFAE)}

  /* exercises */
  .xl{display:grid;gap:10px}
  @media (min-width:960px){.xl{grid-template-columns:1fr 1fr;gap:14px}}
  .xc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .xc.open{grid-column:1/-1}
  .xh{cursor:pointer;user-select:text;-webkit-user-select:text;display:grid;grid-template-columns:62px minmax(0,1fr) auto;grid-template-areas:"img nm rx" "img br rx";column-gap:12px;row-gap:2px;align-items:center;padding:8px 12px 8px 8px;width:100%;text-align:left}
  .xh img{grid-area:img;width:62px;height:62px;border-radius:12px;border:1px solid var(--line);background:#fff}
  .xh .nm{grid-area:nm;font-weight:700;font-size:15.5px;align-self:end}
  .xh .br{grid-area:br;color:var(--mute);font-size:12.5px;line-height:1.4;align-self:start;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .xh .rx{grid-area:rx;font-weight:800;font-family:var(--num);font-size:17px;white-space:nowrap;text-align:right;line-height:1.2}
  .xh .rx small{display:block;font-family:"PingFang SC","Noto Sans SC",sans-serif;font-weight:500;font-size:11.5px;color:var(--mute)}
  .xh .more{display:none}
  @media (min-width:960px){
    .xh{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"img img" "nm rx" "br br" "more more";row-gap:4px;column-gap:10px;align-items:center;padding:10px 10px 14px}
    .xh img{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;border-radius:14px;margin-bottom:8px}
    .xh .nm{font-size:18px;padding-left:6px;align-self:center}
    .xh .rx{font-size:24px;padding-right:6px}
    .xh .rx small{display:inline;font-size:12.5px;margin-left:4px}
    .xh .br{font-size:13.5px;line-height:1.5;padding:0 6px;-webkit-line-clamp:2}
    .xh .more{grid-area:more;display:inline-block;color:var(--acc-ink);font-size:13.5px;font-weight:600;padding-left:6px;margin-top:4px}
    .xc.open .xh{grid-template-columns:minmax(0,calc(50% - 7px)) minmax(0,1fr) auto;grid-template-areas:"img nm rx" "img br br" "img more more";grid-template-rows:auto auto 1fr;column-gap:16px;align-items:start}
    .xc.open .xh img{margin:0}
    .xc.open .xh .nm{margin-top:8px;font-size:20px}.xc.open .xh .rx{margin-top:6px}
    .xc.open .xh .br{-webkit-line-clamp:unset}
  }
  .xd{display:none;border-top:1px solid var(--line);padding:14px;gap:16px;background:#FFFCF8}
  .xc.open .xd{display:grid}
  @media (min-width:700px){.xc.open .xd{grid-template-columns:minmax(0,1fr) 340px}}
  .xd h4{margin:0 0 4px;font-size:13px;color:var(--mute);font-weight:500}
  .xd ul{margin:0 0 12px;padding-left:18px}
  .xd li{margin:3px 0;font-size:14px}
  .stills{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;font-size:13px;color:var(--mute)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pair img{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff}
  .pair span{text-align:center;font-size:12px;margin:2px 0 6px}
  .stills a{display:inline-block;margin-top:8px;color:var(--acc-ink);font-weight:600;text-decoration:none}

  /* foldable sections */
  #exList{display:flex;flex-direction:column;gap:16px}
  .ph-h{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;cursor:pointer;user-select:text;-webkit-user-select:text}
  .ph-t{flex:1;min-width:0}.ph-t b{display:block;font-size:16px}.ph-t small{color:var(--mute);font-size:12.5px}
  .ph-h .tg{color:var(--acc-ink);font-size:13px;font-weight:600;white-space:nowrap}
  .thumbs{display:none;flex:0 0 auto}
  .ph.fold .thumbs{display:flex}
  .thumbs img{width:36px;height:36px;border-radius:9px;border:2px solid var(--card);background:#fff;margin-left:-10px;box-shadow:0 0 0 1px var(--line)}
  .thumbs img:first-child{margin-left:0}
  @media (max-width:520px){.thumbs img:nth-child(n+4){display:none}}
  .ph-b{margin-top:10px}
  .ph.fold .ph-b{display:none}
  .mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mv{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px 8px 12px;display:flex;flex-direction:column}
  .mv img{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}
  .mv-t{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin:8px 4px 2px;flex-wrap:wrap}
  .mv .nm{font-weight:700;font-size:15px}
  .mv .dose{color:var(--acc-ink);font-weight:700;font-size:13px;white-space:nowrap}
  .mv p{margin:0 4px;color:var(--mute);font-size:12.5px;line-height:1.45}
  @media (min-width:960px){.mg{gap:14px}.mv{padding:10px 10px 14px}.mv img{border-radius:14px;margin-bottom:4px}.mv-t{margin:8px 6px 2px}.mv .nm{font-size:18px}.mv .dose{font-size:15px}.mv p{font-size:13.5px;margin:0 6px;line-height:1.5}}
  .segs i.w{background:#F6EBDD}
  .segs i.w.d,.segs i.w.c::after{background:#FFB59E}

  /* rest day */
  .restcard{background:var(--card);border-radius:18px;padding:28px 18px;text-align:center;color:var(--mute);box-shadow:var(--shadow)}

  /* calendar */
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-nav button{width:30px;height:30px;border-radius:50%;background:var(--bg);font-size:16px;line-height:1}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .stats div{background:var(--bg);border-radius:14px;padding:8px 10px}
  .stats b{display:block;font-family:var(--num);font-size:22px;line-height:1.2}
  .stats small{color:var(--mute);font-size:12px}
  .mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 4px}
  .mcal .wd{text-align:center;font-size:12px;color:var(--mute);padding:2px 0 4px}
  .mcal .d{width:34px;height:34px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px}
  .mcal .d:disabled{cursor:default;color:#CFC3B4}
  .mcal .d.rest{color:#C9BBAA}
  .mcal .d.done{background:var(--acc-soft);color:var(--acc-deep);font-weight:700}
  .mcal .d.today{background:var(--acc);color:#fff;font-weight:700}
  .mcal .d.today.done{box-shadow:0 0 0 2px var(--acc-soft)}
  .mcal .d.miss{box-shadow:inset 0 0 0 1.5px var(--miss)}
  .cal-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:12px;color:var(--mute)}
  .cal-foot .lg{display:inline-flex;align-items:center;gap:5px}
  .cal-foot .lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .cal-foot .grow{flex:1}
  .chipbtn{border-radius:99px;padding:6px 12px;background:var(--bg);font-size:13px;color:var(--ink)}
  .ck-today{border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;background:var(--acc-wash);color:var(--acc-ink)}
  .ck-today.done{background:var(--acc-soft);color:var(--acc-deep)}
  .warn{font-size:12.5px;color:var(--acc-deep);margin-top:8px}

  /* settings */
  .set .rows{display:grid;gap:10px}
  .set .row{display:flex;align-items:center;gap:10px;font-size:14px}
  .set .row>span:first-child{width:3.2em;color:var(--mute)}
  .set input[type=range]{flex:1;accent-color:var(--acc)}
  .set .val{width:2.4em;text-align:right;font-family:var(--num);font-weight:700}
  .tog{display:inline-flex;background:var(--bg);border-radius:99px;padding:3px}
  .tog button{padding:5px 14px;border-radius:99px;font-size:13px;color:var(--mute)}
  .tog button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  .set .hint{font-size:12px;color:var(--mute);margin:8px 0 0}

  /* follow mode */
  #follow{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  #follow.on{display:flex}
  .f-top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;min-height:36px}
  .f-top button{padding:6px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);font-size:14px}
  .f-main{flex:1;display:flex;flex-direction:column;min-height:0}
  .f-img{background:#fff;border-radius:26px;padding:10px;box-shadow:var(--shadow);margin-top:8px;flex:0 1 auto;min-height:0;display:flex;justify-content:center}
  .f-img img{width:100%;max-width:min(100%,46vh);aspect-ratio:1;object-fit:contain}
  .f-info{display:flex;flex-direction:column;flex:1 0 auto}
  .segs{display:flex;gap:4px;margin-top:16px}
  .segs i{flex:1;height:5px;border-radius:9px;background:var(--track);overflow:hidden;position:relative}
  .segs i.d{background:var(--acc)}
  .segs i.c::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--acc);transition:width .3s}
  .f-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px}
  .f-name b{font-size:22px;line-height:1.25}
  .f-name span{color:var(--mute);font-size:14px;white-space:nowrap}
  .f-phase{color:var(--mute);font-size:14px;min-height:1.5em}
  .f-big{font-family:var(--num);font-size:88px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .f-big small{font-size:28px;color:#C9BBAA;font-weight:600;letter-spacing:0;margin-left:4px}
  .f-big.rest{color:var(--acc)}
  .f-cue{margin-top:10px;background:var(--acc-wash);color:#B23A1C;border-radius:14px;padding:10px 12px;font-size:14px;min-height:42px}
  .f-cue:empty{visibility:hidden}
  .f-ctl{display:flex;gap:10px;margin-top:auto;padding-top:16px}
  .f-ctl button{flex:1;border-radius:99px;padding:15px;font-weight:700;font-size:16px;background:var(--card);box-shadow:var(--shadow)}
  .f-ctl .p{flex:2;background:var(--ink);color:#fff;box-shadow:none}
  .f-ctl .ok{flex:2;background:var(--acc);color:#fff;box-shadow:none}
  .f-ctl .key{font-weight:500;opacity:.6;font-size:13px;display:none}
  @media (min-width:960px){
    #follow{padding:24px 48px 34px}
    .f-info{flex:none}
    .f-main{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:48px;align-items:center;max-width:1180px;width:100%;margin:0 auto}
    .f-img{margin:0;padding:14px;border-radius:30px}
    .f-img img{max-width:100%}
    .segs{margin-top:0}
    .f-name b{font-size:32px}
    .f-big{font-size:200px}.f-big small{font-size:48px}
    .f-cue{font-size:16px}
    .f-ctl{margin-top:28px}
  }
  @media (min-width:960px) and (hover:hover){.f-ctl .key{display:inline}}
  @media (max-height:640px) and (max-width:959px){.f-big{font-size:64px}.f-img img{max-width:min(100%,36vh)}}
</style>
</head>
<body>
<div class="app">
  <div class="grid">
    <header class="hi">
      <div><small id="hiDate"></small><h1 id="hiTitle">每天20分钟</h1></div>
      <div class="streak" id="streakChip"><i></i>连续 0 天</div>
    </header>

    <section class="week panel" aria-label="本周">
      <h2>本周</h2>
      <div class="days" id="days"></div>
    </section>

    <section class="hero" id="hero"></section>

    <section class="exs" aria-label="动作">
      <div id="exList"></div>
    </section>

    <section class="cal panel" aria-label="打卡">
      <h2><span id="calTitle"></span><span class="cal-nav"><button id="calPrev" aria-label="上个月">‹</button><button id="calNext" aria-label="下个月">›</button></span></h2>
      <div class="stats"><div><b id="ckStreak">0</b><small>连续天数</small></div><div><b id="ckMonth">0</b><small>本月</small></div><div><b id="ckTotal">0</b><small>累计</small></div></div>
      <div class="mcal" id="cal"></div>
      <div class="cal-foot">
        <span class="lg"><i style="background:var(--acc-soft)"></i>已打卡</span>
        <span class="lg"><i style="box-shadow:inset 0 0 0 1.5px var(--miss)"></i>漏掉</span>
        <span class="grow"></span>
        <button class="ck-today" id="ckToday">今天打卡</button>
      </div>
      <div class="cal-foot"><span class="grow"></span><button class="chipbtn" id="ckExport">导出</button><button class="chipbtn" id="ckImport">导入</button></div>
      <div class="warn" id="ckWarn" hidden>这个浏览器不允许网页保存数据,打卡记录关掉页面就会丢。请用「导出」手动备份。</div>
    </section>

    <section class="set panel" aria-label="跟练设置">
      <h2>跟练设置</h2>
      <div class="rows">
        <div class="row"><span>语音</span><div class="tog" id="voiceTog"><button data-v="1" class="on">开</button><button data-v="0">关</button></div></div>
        <div class="row"><span>热身</span><div class="tog" id="warmTog"><button data-v="1" class="on">开</button><button data-v="0">关</button></div></div>
        <div class="row"><span>放松</span><div class="tog" id="coolTog"><button data-v="1" class="on">开</button><button data-v="0">关</button></div></div>
        <div class="row"><span>节拍</span><div class="tog" id="beatTog"><button data-v="1">开</button><button data-v="0" class="on">关</button></div></div>
        <div class="row"><span>速度</span><input type="range" id="bpm" min="80" max="140" value="104" aria-label="节拍速度"><span class="val" id="bpmV">104</span></div>
        <div class="row"><span>音量</span><input type="range" id="vol" min="0" max="100" value="60" aria-label="节拍音量"><span class="val" id="volV">60</span></div>
      </div>
    </section>
  </div>
</div>

<div id="follow" role="dialog" aria-modal="true" aria-label="跟练" aria-live="polite">
  <div class="f-top"><span id="fWhere"></span><button id="fQuit">结束</button></div>
  <div class="f-main">
    <div class="f-img"><img id="fImg" alt=""></div>
    <div class="f-info">
      <div class="segs" id="segs"></div>
      <div class="f-name"><b id="fName"></b><span id="fSet"></span></div>
      <div class="f-phase" id="fPhase"></div>
      <div class="f-big" id="fBig">—</div>
      <div class="f-cue" id="fCue"></div>
      <div class="f-ctl">
        <button id="fSkip">跳过</button>
        <button id="fPause" class="p">暂停 <span class="key">· 空格</span></button>
        <button id="fCheck" class="ok" hidden>打卡并结束</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- 动作数据 ---------------- */
const EX = {
upper:[
 {id:'pushup',name:'俯卧撑',sets:3,brief:'做到做不动为止,记下个数。做不到5个的话这一组改成手撑桌边做。',
  anims:[{gif:'I4hDWkc',reps:8}],

const isRestDay=d=>d.getDay()===0;
function streak(){let n=0;const d=new Date();if(!checkins.has(ymd(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<3650;i++){if(isRestDay(d)){d.setDate(d.getDate()-1);continue;}if(checkins.has(ymd(d))){n++;d.setDate(d.getDate()-1);}else break;}return n;}
function toggleCk(s){if(checkins.has(s))checkins.delete(s);else checkins.add(s);saveCk();renderAll();}

function renderWeek(){

// Foldable section; folded state is remembered on this device, everything starts open.
const FOLD_KEY='home-workout-folded';
let folded=(()=>{try{return JSON.parse(localStorage.getItem(FOLD_KEY))||{};}catch(e){return {};}})();
function section(id,title,meta,gifs,body){
  const sec=document.createElement('section');sec.className='ph'+(folded[id]?' fold':'');
  sec.innerHTML=`<div class="ph-h" role="button" tabindex="0" aria-expanded="${!folded[id]}"><span class="ph-t"><b>${title}</b><small>${meta}</small></span>
    <span class="thumbs">${gifs.map(g=>`<img src="${gif(g)}" alt="" loading="lazy">`).join('')}</span><span class="tg">${folded[id]?'展开 ↓':'收起 ↑'}</span></div>`;
  const b=document.createElement('div');b.className='ph-b';b.appendChild(body);sec.appendChild(b);
  const hd=sec.querySelector('.ph-h'),flip=()=>{const f=sec.classList.toggle('fold');folded[id]=f;try{localStorage.setItem(FOLD_KEY,JSON.stringify(folded));}catch(e){}
    hd.setAttribute('aria-expanded',!f);sec.querySelector('.tg').textContent=f?'展开 ↓':'收起 ↑';};
  hd.onclick=()=>{if(String(getSelection()||'').trim())return;flip();};
  hd.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();flip();}};
  return sec;
}
function moveGrid(list){
  const g=document.createElement('div');g.className='mg';
  g.innerHTML=list.map(m=>`<article class="mv"><img src="${gif(m.gif)}" alt="${esc(m.name)}" loading="lazy" width="300" height="225">
    <div class="mv-t"><span class="nm">${esc(m.name)}</span><span class="dose">${m.sides?'每侧 ':''}${m.sec} 秒</span></div><p>${esc(m.cue)}</p></article>`).join('');
  return g;
}
function exCard(ex){
  const rx=ex.hold?`${ex.sets}×${ex.hold}″`:`${ex.sets}×${ex.anims.map(a=>a.reps).join('+')}`, side=sideOf(ex);

    <span class="nm">${esc(ex.name)}</span><span class="rx">${rx}${side?`<small>${side}</small>`:''}</span>
    <span class="br">${esc(ex.brief)}</span><span class="more">动作详解 →</span></div>
    <div class="xd"><div><h4>要点</h4><ul>${ex.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>

    ${esc(ex.note)}<br><a target="_blank" rel="noopener" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(ex.search)}">在 B 站看真人示范 ↗</a></div></div>`;
  const hd=c.querySelector('.xh');
  const flip=()=>{const o=c.classList.toggle('open');hd.setAttribute('aria-expanded',o);const m=c.querySelector('.more');if(m)m.textContent=o?'收起 ↑':'动作详解 →';};
  hd.onclick=()=>{if(String(getSelection()||'').trim())return;flip();};
  hd.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();flip();}};
  return c;
}
function renderCal(){
  const done=checkins.has(todayStr), b=$('ckToday');
  b.textContent=done?'今天已打卡 ✓':'今天打卡';b.classList.toggle('done',done);
  const mp=`${calY}-${String(calM+1).padStart(2,'0')}`;
  $('ckStreak').textContent=streak();$('ckTotal').textContent=checkins.size;$('ckMonth').textContent=[...checkins].filter(s=>s.startsWith(mp)).length;
  $('calTitle').textContent=`${calY} 年 ${calM+1} 月`;
  const cal=$('cal');cal.innerHTML='';
  ['一','二','三','四','五','六','日'].forEach(w=>{const e=document.createElement('div');e.className='wd';e.textContent=w;cal.appendChild(e);});
  const pad=(new Date(calY,calM,1).getDay()+6)%7;for(let i=0;i<pad;i++)cal.appendChild(document.createElement('div'));
  const days=new Date(calY,calM+1,0).getDate();
  for(let d=1;d<=days;d++){const dt=new Date(calY,calM,d),s=ymd(dt),e=document.createElement('button');e.className='d';e.textContent=d;

    e.title=checkins.has(s)?'点一下取消':'点一下补打卡';e.onclick=()=>toggleCk(s);cal.appendChild(e);}
}

const SET_KEY='home-workout-settings';
const prefs=Object.assign({voice:true,beat:false,bpm:104,vol:60,warm:true,cool:true},(()=>{try{return JSON.parse(localStorage.getItem(SET_KEY))||{};}catch(e){return {};}})());
function savePrefs(){try{localStorage.setItem(SET_KEY,JSON.stringify(prefs));}catch(e){}}
renderAll();
// Roll over to a new day when the page stays open past midnight.
setInterval(()=>{const n=new Date();if(ymd(n)!==todayStr){const keep=selected===todayIdx;now=n;todayStr=ymd(n);todayIdx=(n.getDay()+6)%7;if(keep)selected=todayIdx;calY=n.getFullYear();calM=n.getMonth();if(!F.running)renderAll();}},60000);

$('ckToday').onclick=()=>toggleCk(todayStr);
$('calPrev').onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCal();};
$('calNext').onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCal();};
$('ckExport').onclick=async()=>{const s=JSON.stringify([...checkins].sort());try{await navigator.clipboard.writeText(s);alert('已复制到剪贴板,粘贴到备忘录里保存即可。');}catch(e){prompt('复制下面的内容保存:',s);}};
$('ckImport').onclick=()=>{const s=prompt('粘贴之前导出的记录:');if(!s)return;try{JSON.parse(s).forEach(x=>{if(/^\d{4}-\d{2}-\d{2}$/.test(x))checkins.add(x);});saveCk();renderAll();}catch(e){alert('格式不对,应该是导出时的那段文字。');}};

function tog(id,key,on){const el=$(id);const paint=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===prefs[key]));
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{prefs[key]=b.dataset.v==='1';savePrefs();paint();on&&on(prefs[key]);});paint();}
tog('voiceTog','voice',v=>{if(!v)hush();});
tog('warmTog','warm',()=>{renderHero();renderEx();});
tog('coolTog','cool',()=>{renderHero();renderEx();});
tog('beatTog','beat',v=>{if(F.running&&!F.paused){v?beatStart():beatStop();}});
$('bpm').value=prefs.bpm;$('bpmV').textContent=prefs.bpm;$('vol').value=prefs.vol;$('volV').textContent=prefs.vol;
$('bpm').oninput=e=>{prefs.bpm=+e.target.value;$('bpmV').textContent=prefs.bpm;savePrefs();};
$('vol').oninput=e=>{prefs.vol=+e.target.value;$('volV').textContent=prefs.vol;if(beat.gain)beat.gain.gain.value=prefs.vol/100*0.8;savePrefs();};

/* ---------------- 声音:提示音、节拍、语音 ---------------- */
let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function beep(freq=880,dur=0.08,vol=0.25){const c=ac();const o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;
  g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+dur);}
const canSpeak=()=>'speechSynthesis' in window;
function say(text){if(!prefs.voice||!canSpeak())return;const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);}
function hush(){if(canSpeak())speechSynthesis.cancel();}
const beat={on:false,next:0,step:0,timer:null,gain:null};
function noise(len){const c=ac();const buf=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource();s.buffer=buf;return s;}
function kick(t){const c=ac();const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(g).connect(beat.gain);o.start(t);o.stop(t+0.3);}
function hat(t,vol){const c=ac();const s=noise(0.05);const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(beat.gain);s.start(t);}
function snare(t){const c=ac();const s=noise(0.12);const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=c.createGain();g.gain.value=0.35;s.connect(f).connect(g).connect(beat.gain);s.start(t);}
function schedule(){const c=ac();const spb=60/prefs.bpm/2;
  while(beat.next<c.currentTime+0.3){const s=beat.step%8;if(s===0||s===4)kick(beat.next);if(s===4)snare(beat.next);hat(beat.next,s%2?0.08:0.16);beat.next+=spb;beat.step++;}}
function beatStart(){if(beat.on||!prefs.beat)return;const c=ac();if(!beat.gain){beat.gain=c.createGain();beat.gain.connect(c.destination);}beat.gain.gain.value=prefs.vol/100*0.8;
  beat.on=true;beat.next=c.currentTime+0.05;beat.step=0;beat.timer=setInterval(schedule,100);}
function beatStop(){beat.on=false;clearInterval(beat.timer);}

/* ---------------- 屏幕常亮 ---------------- */
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){wake=null;}}
function letSleep(){if(wake){wake.release().catch(()=>{});wake=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&F.running)keepAwake();});

/* ---------------- 跟练引擎 ---------------- */
const F={running:false,paused:false,queue:[],i:0,timer:null,restSec:60,tempo:3,works:0};
function buildQueue(k){const q=[];const list=EX[k];
  if(prefs.warm)WARM[k].forEach((m,i,a)=>q.push({type:'timed',phase:'热身',m,idx:i+1,n:a.length}));
  list.forEach((ex,ei)=>{for(let s=1;s<=ex.sets;s++){q.push({type:'work',ex,set:s});
    const last=ei===list.length-1&&s===ex.sets;
    if(!last)q.push({type:'rest',next:s<ex.sets?ex:list[ei+1],nextSet:s<ex.sets?s+1:1});}});
  if(prefs.cool)COOL[k].forEach((m,i,a)=>q.push({type:'timed',phase:'放松',m,idx:i+1,n:a.length}));
  return q;}
function segIndex(i){let n=-1;for(let j=0;j<=i&&j<F.queue.length;j++)if(F.queue[j].type!=='rest')n++;return F.queue[i]&&F.queue[i].type==='rest'?n+1:n;}
function workIndex(i){let n=-1;for(let j=0;j<=i&&j<F.queue.length;j++)if(F.queue[j].type==='work')n++;return n;}
function paintSegs(p){const cur=segIndex(F.i);
  [...$('segs').children].forEach((s,j)=>{s.className=(j<cur?'d':j===cur?'c':'')+(s.dataset.w?' w':'');if(j===cur)s.style.setProperty('--p',(p||0)+'%');});}
function showImg(g){$('fImg').src=gif(g);}
function startFollow(){const k=WEEK[selected].k;if(k==='rest'||F.running)return;
  ac();F.queue=buildQueue(k);F.i=0;F.running=true;F.paused=false;F.works=F.queue.filter(q=>q.type==='work').length;
  $('segs').innerHTML=F.queue.filter(q=>q.type!=='rest').map(q=>q.type==='timed'?'<i data-w="1"></i>':'<i></i>').join('');
  $('fPause').hidden=false;$('fSkip').hidden=false;$('fCheck').hidden=true;$('fPause').firstChild.textContent='暂停 ';
  $('follow').classList.add('on');document.body.style.overflow='hidden';
  keepAwake();beatStart();runItem();}
function endFollow(){F.running=false;clearInterval(F.timer);hush();beatStop();letSleep();$('follow').classList.remove('on');document.body.style.overflow='';renderAll();}
$('fQuit').onclick=endFollow;
$('fCheck').onclick=()=>{if(!checkins.has(todayStr)){checkins.add(todayStr);saveCk();}endFollow();};
$('fPause').onclick=()=>{if(!F.running)return;F.paused=!F.paused;$('fPause').firstChild.textContent=F.paused?'继续 ':'暂停 ';if(F.paused){beatStop();hush();}else beatStart();};
$('fSkip').onclick=()=>{if(!F.running)return;clearInterval(F.timer);nextItem();};
function nextItem(){F.i++;if(F.i>=F.queue.length){finish();return;}runItem();}
function finish(){[...$('segs').children].forEach(s=>s.className='d'+(s.dataset.w?' w':''));
  $('fWhere').textContent='全部完成';$('fName').textContent='今天练完了';$('fSet').textContent='';$('fPhase').textContent='';$('fBig').textContent='✓';$('fBig').className='f-big';
  $('fCue').textContent='记一下今天的重量和次数。明天见。';say('今天练完了,辛苦');clearInterval(F.timer);F.running=false;beatStop();letSleep();
  $('fPause').hidden=true;$('fSkip').hidden=true;$('fCheck').hidden=false;}
function tick(fn){clearInterval(F.timer);F.timer=setInterval(()=>{if(!F.paused)fn();},1000);}
function where(){const it=F.queue[F.i];
  if(it.type==='timed')return `${it.phase} ${it.idx} / ${it.n}`;
  const w=workIndex(F.i),list=EX[WEEK[selected].k],ex=it.type==='work'?it.ex:it.next;
  return `动作 ${list.indexOf(ex)+1} / ${list.length} · 进度 ${Math.min(w+1+(it.type==='rest'?1:0),F.works)} / ${F.works} 组`;}
const secs=n=>`${n}<small>秒</small>`;
function runItem(){
  const it=F.queue[F.i];$('fWhere').textContent=where();paintSegs(0);
  if(it.type==='timed'){
    const m=it.m,first=it.idx===1;
    $('fName').textContent=m.name;$('fSet').textContent=`${it.phase} ${it.idx} / ${it.n}`;$('fBig').className='f-big rest';
    $('fPhase').textContent=m.sides?`每侧 ${m.sec} 秒`:`${m.sec} 秒`;$('fCue').textContent=m.cue;showImg(m.gif);
    const prev=F.queue[F.i-1],toMat=m.floor&&!(prev&&prev.type==='timed'&&prev.m.floor);
    let pre=toMat?10:3;$('fBig').innerHTML=secs(pre);
    say((first?(it.phase==='热身'?'先热身,':'练完了,放松一下,'):'')+m.name);
    tick(()=>{pre--;if(pre>0){$('fBig').innerHTML=secs(pre);return;}
      clearInterval(F.timer);beep(1320,0.12);
      const total=m.sec*(m.sides?2:1);let left=total,s=m.sec;$('fBig').innerHTML=secs(s);
      if(m.sides)$('fPhase').textContent=`第一侧 · ${m.sec} 秒`;
      tick(()=>{left--;s--;paintSegs((total-left)/total*100);
        if(m.sides&&left===m.sec){s=m.sec;beep(880);say('换边');$('fPhase').textContent=`换另一侧 · ${m.sec} 秒`;}
        $('fBig').innerHTML=secs(s);
        if(left>0&&left<=3)beep(880);
        if(left<=0){clearInterval(F.timer);beep(1320,0.15);setTimeout(nextItem,600);}});
    });
    return;}
  if(it.type==='rest'){
    $('fName').textContent='休息';$('fSet').textContent='';$('fBig').className='f-big rest';
    $('fPhase').textContent=`下一组:${it.next.name} 第 ${it.nextSet} 组`;$('fCue').textContent=it.next.points[0];showImg(it.next.anims[0].gif);
    let s=F.restSec;$('fBig').textContent=s;say(`休息${F.restSec}秒,下一组${it.next.name}`);
    tick(()=>{s--;$('fBig').textContent=s;if(s===10){beep(660);say('还有10秒,准备');}if(s<=3&&s>0)beep(880);if(s<=0){beep(1320,0.15);nextItem();}});
    return;}
  const ex=it.ex;$('fName').textContent=ex.name;$('fSet').textContent=`第 ${it.set} / ${ex.sets} 组`;$('fBig').className='f-big';
  let pre=3;$('fPhase').textContent='准备';$('fBig').textContent=pre;$('fCue').textContent=ex.points[0];showImg(ex.anims[0].gif);say(`${ex.name},第${it.set}组,准备`);
  tick(()=>{pre--;beep(660);if(pre>0)$('fBig').textContent=pre;else{clearInterval(F.timer);work(it);}});
}
function work(it){
  const ex=it.ex,cues=ex.points;let ci=1;
  if(ex.hold){let s=ex.hold;$('fPhase').textContent='保持';$('fBig').innerHTML=secs(s);beep(1320,0.15);say('开始');
    tick(()=>{s--;$('fBig').innerHTML=secs(s);paintSegs((ex.hold-s)/ex.hold*100);
      if(s%12===0&&ci<cues.length){$('fCue').textContent=cues[ci];say(cues[ci]);ci++;}
      if(s===10)say('还有10秒');if(s<=3&&s>0)beep(880);if(s<=0){beep(1320,0.2);say('放松');clearInterval(F.timer);setTimeout(nextItem,1200);}});
    return;}
  // Exercises done per side count every rep on one side, pause to switch, then the other side.
  const a=ex.anims[0],passes=ex.sides?2:1;let pass=0,rep=0,sec=0;
  const label=()=>ex.sides?(pass===0?'第一侧 · ':'另一侧 · '):'';
  const start=()=>{rep=0;sec=0;showImg(a.gif);$('fPhase').textContent=`${label()}每次 ${F.tempo} 秒,下去慢,起来快`;$('fBig').innerHTML=`0<small>/ ${a.reps}</small>`;beep(1320,0.15);
    tick(()=>{sec++;
      if(sec%F.tempo===1){rep++;$('fBig').innerHTML=`${rep}<small>/ ${a.reps}</small>`;paintSegs((pass*a.reps+rep)/(passes*a.reps)*100);beep(rep===a.reps?1100:880);say(String(rep));
        if(rep%4===0&&ci<cues.length){$('fCue').textContent=cues[ci];ci++;}}
      else if(sec%F.tempo===2)beep(520,0.05,0.12);
      if(rep>=a.reps&&sec%F.tempo===0){clearInterval(F.timer);pass++;
        if(pass<passes){say('换另一侧');$('fPhase').textContent='换另一侧';$('fBig').textContent='换';setTimeout(()=>{if(F.running)start();},3000);}
        else{say('这组完成');setTimeout(nextItem,1000);}}});};
  say('开始');start();
}
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  if(F.running){if(e.code==='Space'){e.preventDefault();$('fPause').click();}if(e.code==='Escape')endFollow();return;}
  if($('follow').classList.contains('on')){if(e.code==='Escape')endFollow();return;}
  if(e.code==='Space'&&$('startBtn')){e.preventDefault();startFollow();}
});

/* ---------------- 离线 ---------------- */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
